name: Release binaries
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Check release version
        id: version
        shell: python
        run: |
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          manifest = tomllib.loads(pathlib.Path("herdr-plugin.toml").read_text())["version"]
          if manifest != version:
              raise SystemExit(f"Cargo.toml declares {version}, herdr-plugin.toml declares {manifest}")
          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and tag != f"v{version}":
              raise SystemExit(f"Tag {tag} points to plugin version {version}; expected v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test_install.ps1
      - if: runner.os != 'Windows'
        run: python3 tools/test_install.py
      - name: Smoke test compiled binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/herdr-command-shelf${{ matrix.extension }} --version
      - name: Package binary and checksum
        shell: python
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import hashlib, os, pathlib, shutil
          root = pathlib.Path('.')
          version = os.environ['VERSION']
          target, ext = os.environ['TARGET'], os.environ.get('EXTENSION', '')
          out = root / 'dist'
          out.mkdir()
          asset = out / f'herdr-command-shelf-v{version}-{target}{ext}'
          shutil.copyfile(root / 'target' / target / 'release' / ('herdr-command-shelf' + ext), asset)
          asset.chmod(0o755)
          pathlib.Path(str(asset) + '.sha256').write_bytes(hashlib.sha256(asset.read_bytes()).hexdigest().encode('ascii') + b'\n')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  upload-release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries and checksums to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber
