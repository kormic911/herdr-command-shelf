[package]
name = "herdr-command-shelf"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-truncate = "1"
tui-textarea = {version = "0.7", features = ["crossterm"]}
fs2 = "0.4"
base64 = "0.22"
toml = { version = "0.9", default-features = false, features = ["parse", "std", "serde"] }
sha2 = "0.10"
terminal-colorsaurus = "1"
